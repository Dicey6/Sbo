<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sol Bounty - Hunt. Complete. Earn.</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0B0F19;
            color: white;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Header */
        .hero { text-align: center; padding: 40px 20px; }
        .logo { width: 80px; height: 80px; margin-bottom: 20px; background: #9945FF; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 40px; }
        h1 { font-size: 2.5rem; background: linear-gradient(135deg, #9945FF, #14F195); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .tagline { color: #14F195; font-size: 1.2rem; margin: 10px 0; }
        
        /* Cards */
        .card { background: #111827; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #374151; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #374151; flex-wrap: wrap; gap: 10px; }
        .copy-btn { background: #9945FF; padding: 5px 15px; border: none; border-radius: 8px; color: white; cursor: pointer; }
        
        /* Bounties */
        .bounties-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .bounty-card { background: #111827; border-radius: 16px; padding: 20px; border: 1px solid #374151; }
        .bounty-title { color: #FFB648; font-size: 1.3rem; margin-bottom: 10px; }
        .bounty-instructions { background: #1F2937; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 0.9rem; }
        .reward { color: #FFB648; font-weight: bold; font-size: 1.2rem; }
        .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
        .status.active { background: rgba(20,241,149,0.2); color: #14F195; }
        .btn-submit { background: #9945FF; width: 100%; padding: 10px; border: none; border-radius: 8px; color: white; margin-top: 10px; cursor: pointer; }
        
        /* Submissions */
        .submissions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 15px; }
        .submission-card { background: #1F2937; border-radius: 8px; padding: 8px; }
        .submission-media { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; }
        .submission-nickname { color: #14F195; font-size: 0.8rem; margin-top: 5px; }
        
        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #111827; padding: 20px; border-radius: 16px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .hidden { display: none; }
        
        /* Forms */
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; background: #1F2937; border: 1px solid #374151; border-radius: 8px; color: white; }
        button { background: #9945FF; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; }
        .toast { position: fixed; top: 20px; right: 20px; background: #111827; padding: 10px 20px; border-radius: 8px; border-left: 4px solid #14F195; z-index: 2000; }
        
        /* Progress bar */
        .progress-bar { background: #1F2937; border-radius: 10px; height: 30px; overflow: hidden; margin: 10px 0; }
        .progress-fill { background: linear-gradient(90deg, #FFB648, #ffd700); height: 100%; width: 0%; transition: width 0.3s; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; }
        
        @media (max-width: 768px) {
            .bounties-grid { grid-template-columns: 1fr; }
            .info-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div id="toast" class="toast hidden"></div>
    <div class="container">
        
        <!-- Hero -->
        <div class="hero">
            <div class="logo">🏴‍☠️</div>
            <h1>Sol Bounty</h1>
            <p class="tagline">Hunt. Complete. Earn.</p>
            <p>Complete challenges and earn SOL rewards on Solana</p>
        </div>
        
        <!-- Total Pool -->
        <div class="card">
            <h3>🏆 Total Bounty Pool</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0 SOL</div>
            </div>
            <p id="totalPoolText" style="text-align: center; margin-top: 10px;">Loading...</p>
        </div>
        
        <!-- Project Info -->
        <div class="card">
            <h3>📋 Project Information</h3>
            <div class="info-row">
                <strong>Contract:</strong>
                <code id="contractAddress">Loading...</code>
                <button class="copy-btn" onclick="copyContract()">Copy</button>
            </div>
            <div class="info-row">
                <strong>Official X:</strong>
                <a id="officialX" href="#" target="_blank">Loading...</a>
            </div>
        </div>
        
        <!-- Token Stats -->
        <div id="tokenStats" class="card hidden">
            <h3>📊 Token Stats</h3>
            <div id="statsDisplay">Loading...</div>
        </div>
        
        <!-- Active Bounties -->
        <h2>🎯 Active Bounties</h2>
        <div id="bountiesContainer" class="bounties-grid">
            <div class="card">Loading bounties...</div>
        </div>
    </div>
    
    <!-- Submission Modal -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h3>Submit Your Entry</h3>
            <button onclick="closeModal()" style="float: right;">✕</button>
            <div style="clear: both;"></div>
            <input type="text" id="nickname" placeholder="Nickname *">
            <input type="file" id="mediaFile" accept="image/*,video/*">
            <textarea id="note" rows="3" placeholder="Optional note"></textarea>
            <button onclick="submitEntry()">Submit Entry</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const SUPABASE_URL = 'https://jsrmgdaqqovdvrsfdyfb.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impzcm1nZGFxcW92ZHZyc2ZkeWZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5MjUxOTYsImV4cCI6MjA5NjUwMTE5Nn0.LwRM51qKUUaAv8TbO1Hv8X9454es6Ao35VDgSqKH4OM';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentBountyId = null;
        
        // ============================================
        // HELPER FUNCTIONS
        // ============================================
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
        
        function copyContract() {
            const addr = document.getElementById('contractAddress').textContent;
            navigator.clipboard.writeText(addr);
            showToast('Contract copied!');
        }
        
        function openModal(bountyId) {
            currentBountyId = bountyId;
            document.getElementById('modal').classList.remove('hidden');
        }
        
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('nickname').value = '';
            document.getElementById('mediaFile').value = '';
            document.getElementById('note').value = '';
        }
        
        // ============================================
        // LOAD SETTINGS
        // ============================================
        async function loadSettings() {
            try {
                const { data, error } = await supabaseClient
                    .from('settings')
                    .select('*')
                    .eq('id', 1)
                    .single();
                
                if (error && error.code !== 'PGRST116') throw error;
                
                if (data) {
                    document.getElementById('contractAddress').textContent = data.contract_address || 'Not set';
                    document.getElementById('officialX').href = data.official_x || '#';
                    document.getElementById('officialX').textContent = data.official_x || 'Not set';
                    
                    const totalPool = data.total_pooled_sol || 25;
                    document.getElementById('totalPoolText').textContent = `${totalPool} SOL available`;
                    
                    const percentage = Math.min((totalPool / 1000) * 100, 100);
                    const fill = document.getElementById('progressFill');
                    fill.style.width = `${percentage}%`;
                    fill.textContent = percentage > 15 ? `${totalPool} SOL` : '';
                    
                    if (data.show_token_stats && data.contract_address) {
                        document.getElementById('tokenStats').classList.remove('hidden');
                        fetchTokenStats(data.contract_address);
                    }
                }
            } catch (error) {
                console.error('Settings error:', error);
            }
        }
        
        // ============================================
        // TOKEN STATS
        // ============================================
        async function fetchTokenStats(address) {
            try {
                const response = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${address}`);
                const data = await response.json();
                
                if (data.pairs && data.pairs.length > 0) {
                    const pair = data.pairs[0];
                    const age = Math.floor((Date.now() - pair.pairCreatedAt) / (86400000));
                    document.getElementById('statsDisplay').innerHTML = `
                        <p>💰 Market Cap: $${(pair.marketCap / 1000000).toFixed(2)}M</p>
                        <p>📅 Age: ${age} days</p>
                        <p>👥 Holders: ${pair.lpTotalSupply?.toLocaleString() || 'N/A'}</p>
                    `;
                }
            } catch (error) {
                document.getElementById('statsDisplay').innerHTML = '<p>Stats unavailable</p>';
            }
        }
        
        // ============================================
        // LOAD BOUNTIES
        // ============================================
        async function loadBounties() {
            const container = document.getElementById('bountiesContainer');
            container.innerHTML = '<div class="card">Loading...</div>';
            
            try {
                const { data, error } = await supabaseClient
                    .from('bounties')
                    .select('*')
                    .in('status', ['active'])
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="card">No active bounties yet. Check back soon!</div>';
                    return;
                }
                
                container.innerHTML = data.map(bounty => `
                    <div class="bounty-card">
                        <div class="bounty-title">${escapeHtml(bounty.title)}</div>
                        <p>${escapeHtml(bounty.description)}</p>
                        ${bounty.instructions ? `<div class="bounty-instructions"><strong>📝 Instructions:</strong><br>${escapeHtml(bounty.instructions)}</div>` : ''}
                        <div style="display: flex; justify-content: space-between; margin: 10px 0;">
                            <span class="reward">💰 ${bounty.reward_pool} SOL</span>
                            <span class="status active">ACTIVE</span>
                        </div>
                        <button class="btn-submit" onclick="openModal('${bounty.id}')">📤 Submit Entry</button>
                        <div id="submissions-${bounty.id}"></div>
                    </div>
                `).join('');
                
                // Load submissions for each bounty
                for (const bounty of data) {
                    loadSubmissions(bounty.id);
                }
                
            } catch (error) {
                console.error('Load bounties error:', error);
                container.innerHTML = '<div class="card">Error loading bounties. Please refresh.</div>';
            }
        }
        
        // ============================================
        // LOAD SUBMISSIONS
        // ============================================
        async function loadSubmissions(bountyId) {
            try {
                const { data, error } = await supabaseClient
                    .from('submissions')
                    .select('*')
                    .eq('bounty_id', bountyId)
                    .eq('approved', true)
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                
                const container = document.getElementById(`submissions-${bountyId}`);
                if (!container) return;
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<p style="margin-top: 15px; color: #9CA3AF; text-align: center;">No submissions yet. Be the first!</p>';
                    return;
                }
                
                container.innerHTML = `
                    <div class="submissions-grid">
                        ${data.map(sub => `
                            <div class="submission-card">
                                ${sub.media_type === 'image' ? 
                                    `<img src="${sub.media_url}" class="submission-media" loading="lazy">` :
                                    `<video src="${sub.media_url}" class="submission-media" controls></video>`
                                }
                                <div class="submission-nickname">🏆 ${escapeHtml(sub.nickname)}</div>
                                ${sub.note ? `<div style="font-size: 0.7rem; color: #9CA3AF;">💬 ${escapeHtml(sub.note)}</div>` : ''}
                                <div style="font-size: 0.6rem; color: #6B7280;">${new Date(sub.created_at).toLocaleDateString()}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
                
            } catch (error) {
                console.error('Load submissions error:', error);
            }
        }
        
        // ============================================
        // SUBMIT ENTRY
        // ============================================
        async function submitEntry() {
            const nickname = document.getElementById('nickname').value.trim();
            const file = document.getElementById('mediaFile').files[0];
            const note = document.getElementById('note').value.trim();
            
            if (!nickname) {
                showToast('Please enter a nickname', 'error');
                return;
            }
            
            if (!file) {
                showToast('Please upload an image or video', 'error');
                return;
            }
            
            showToast('Uploading...', 'success');
            
            try {
                // Upload file
                const fileExt = file.name.split('.').pop();
                const fileName = `${currentBountyId}/${Date.now()}.${fileExt}`;
                const filePath = `submissions/${fileName}`;
                
                const { error: uploadError } = await supabaseClient.storage
                    .from('bounty-media')
                    .upload(filePath, file);
                
                if (uploadError) throw uploadError;
                
                const { data: { publicUrl } } = supabaseClient.storage
                    .from('bounty-media')
                    .getPublicUrl(filePath);
                
                // Save to database
                const { error: dbError } = await supabaseClient
                    .from('submissions')
                    .insert({
                        bounty_id: currentBountyId,
                        nickname: nickname,
                        media_url: publicUrl,
                        media_type: file.type.startsWith('image/') ? 'image' : 'video',
                        note: note || null,
                        approved: true,
                        created_at: new Date()
                    });
                
                if (dbError) throw dbError;
                
                showToast('✅ Submission successful!');
                closeModal();
                loadSubmissions(currentBountyId);
                
            } catch (error) {
                console.error('Submit error:', error);
                showToast('Error: ' + error.message, 'error');
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // ============================================
        // INITIALIZE
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            loadBounties();
        });
    </script>
</body>
</html>
